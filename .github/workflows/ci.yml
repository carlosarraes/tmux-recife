name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - name: Check
        run: just check
